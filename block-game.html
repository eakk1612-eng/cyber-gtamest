<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Blocks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #000a1a 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: absolute; width: 200%; height: 200%;
            background:
                repeating-linear-gradient(0deg, rgba(0,255,255,.03) 0px, transparent 1px, transparent 2px, rgba(0,255,255,.03) 3px),
                repeating-linear-gradient(90deg, rgba(255,0,255,.03) 0px, transparent 1px, transparent 2px, rgba(255,0,255,.03) 3px);
            animation: gridMove 20s linear infinite; pointer-events: none;
        }
        @keyframes gridMove { 0%{transform:translate(0,0)} 100%{transform:translate(50px,50px)} }
        .container { text-align: center; position: relative; z-index: 1; }
        h1 {
            font-size: 3em; color:#00ffff;
            text-shadow: 0 0 10px #00ffff,0 0 20px #00ffff,0 0 30px #ff00ff,0 0 40px #ff00ff;
            margin-bottom:10px; animation: glowPulse 2s ease-in-out infinite; letter-spacing:3px;
        }
        @keyframes glowPulse { 0%,100%{opacity:1} 50%{opacity:.8} }
        .top-nav { margin-bottom: 15px; }
        .menu-btn {
            padding: 8px 18px; font-size: .9em; border: 1px solid #00ffff; border-radius: 8px;
            background: rgba(0,255,255,.08); color:#00ffff; cursor:pointer; font-family:inherit;
            box-shadow: 0 0 12px rgba(0,255,255,.35);
        }
        .score-panel { display:flex; justify-content:center; gap:30px; margin-bottom:20px; }
        .score-item {
            background:rgba(0,255,255,.1); border:2px solid #00ffff; padding:10px 20px;
            border-radius:10px; box-shadow:0 0 10px rgba(0,255,255,.5), inset 0 0 10px rgba(0,255,255,.2);
        }
        .score-item label { color:#ff00ff; font-size:.9em; display:block; text-shadow:0 0 5px #ff00ff; }
        .score-item span { color:#00ffff; font-size:1.5em; font-weight:bold; text-shadow:0 0 10px #00ffff; }
        #game-board {
            display:grid; grid-template-columns:repeat(6,80px); grid-template-rows:repeat(6,80px);
            gap:10px; margin:0 auto; padding:20px; background:rgba(0,0,0,.5);
            border:3px solid #00ffff; border-radius:15px;
            box-shadow:0 0 30px rgba(0,255,255,.5), inset 0 0 30px rgba(0,0,0,.5);
        }
        .block {
            width:80px; height:80px; border-radius:10px; cursor:pointer; position:relative;
            transform-style:preserve-3d; transition:all .3s ease; border:2px solid;
            display:flex; align-items:center; justify-content:center; font-size:2em; font-weight:bold;
            animation:float 3s ease-in-out infinite;
        }
        @keyframes float { 0%,100%{transform:translateY(0) rotateX(0)} 50%{transform:translateY(-5px) rotateX(5deg)} }
        .block:hover { transform:translateY(-10px) rotateX(10deg) scale(1.05); filter:brightness(1.3); }
        .block.selected { transform:translateY(-15px) rotateX(15deg) scale(1.1); animation:pulse .5s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 20px currentColor} 50%{box-shadow:0 0 40px currentColor,0 0 60px currentColor} }
        .block.matched { animation:explode .5s ease-out forwards; }
        @keyframes explode { 0%{transform:scale(1) rotateZ(0);opacity:1} 100%{transform:scale(2) rotateZ(360deg);opacity:0} }
        .block[data-type="1"]{background:linear-gradient(135deg,#ff00ff,#ff0080);border-color:#ff00ff;color:#fff;box-shadow:0 5px 15px rgba(255,0,255,.5),inset 0 0 20px rgba(255,255,255,.2)}
        .block[data-type="2"]{background:linear-gradient(135deg,#00ffff,#0080ff);border-color:#00ffff;color:#fff;box-shadow:0 5px 15px rgba(0,255,255,.5),inset 0 0 20px rgba(255,255,255,.2)}
        .block[data-type="3"]{background:linear-gradient(135deg,#00ff00,#80ff00);border-color:#00ff00;color:#fff;box-shadow:0 5px 15px rgba(0,255,0,.5),inset 0 0 20px rgba(255,255,255,.2)}
        .block[data-type="4"]{background:linear-gradient(135deg,#ffff00,#ffaa00);border-color:#ffff00;color:#333;box-shadow:0 5px 15px rgba(255,255,0,.5),inset 0 0 20px rgba(255,255,255,.2)}
        .block[data-type="5"]{background:linear-gradient(135deg,#ff0000,#ff6600);border-color:#ff0000;color:#fff;box-shadow:0 5px 15px rgba(255,0,0,.5),inset 0 0 20px rgba(255,255,255,.2)}
        .controls { margin-top:20px; display:flex; justify-content:center; gap:15px; flex-wrap:wrap; }
        button.game-btn {
            padding:12px 30px; font-size:1.1em; font-family:'Courier New',monospace;
            background:linear-gradient(135deg,#00ffff,#ff00ff); border:2px solid #00ffff;
            border-radius:10px; color:#000; font-weight:bold; cursor:pointer; transition:all .3s ease;
            box-shadow:0 0 20px rgba(0,255,255,.5); text-transform:uppercase;
        }
        button.game-btn:hover { transform:translateY(-3px); box-shadow:0 0 30px rgba(0,255,255,.8); background:linear-gradient(135deg,#ff00ff,#00ffff); }
        .info { margin-top:20px; color:#00ffff; font-size:.9em; text-shadow:0 0 5px #00ffff; }
        .particle { position:absolute; width:4px; height:4px; background:#00ffff; border-radius:50%; pointer-events:none; animation:particleFloat 3s linear infinite; }
        @keyframes particleFloat { 0%{transform:translateY(100vh) scale(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-100vh) scale(1);opacity:0} }
        @media(max-width:650px){
            h1{font-size:2em}.score-panel{gap:8px}.score-item{padding:8px 12px}
            #game-board{grid-template-columns:repeat(6,48px);grid-template-rows:repeat(6,48px);gap:5px;padding:10px}
            .block{width:48px;height:48px;font-size:1.25em}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav"><button class="menu-btn" onclick="location.href='index.html'">← MAIN MENU</button></div>
    <h1>⚡ CYBER BLOCKS ⚡</h1>
    <div class="score-panel">
        <div class="score-item"><label>SCORE</label><span id="score">0</span></div>
        <div class="score-item"><label>MOVES</label><span id="moves">30</span></div>
        <div class="score-item"><label>COMBO</label><span id="combo">0</span></div>
    </div>
    <div id="game-board"></div>
    <div class="controls">
        <button class="game-btn" id="new-game">NEW GAME</button>
        <button class="game-btn" id="hint">HINT</button>
    </div>
    <div class="info">Connect 3+ blocks of the same color • Click adjacent blocks</div>
</div>
<script>
const BOARD_SIZE=6,BLOCK_TYPES=5,INITIAL_MOVES=30;
let board=[],score=0,moves=INITIAL_MOVES,combo=0,selectedBlock=null;
const symbols=['◆','●','■','▲','★'];
function initGame(){board=[];score=0;moves=INITIAL_MOVES;combo=0;selectedBlock=null;for(let i=0;i<BOARD_SIZE*BOARD_SIZE;i++)board.push(Math.floor(Math.random()*BLOCK_TYPES)+1);ensureValidMoves();updateDisplay();renderBoard();createParticles();}
function ensureValidMoves(){let hasMatch=false;for(let i=0;i<board.length;i++){for(let n of getNeighbors(i)){if(board[i]===board[n]){hasMatch=true;break;}}if(hasMatch)break;}if(!hasMatch)board[0]=board[1]=1;}
function renderBoard(){const gameBoard=document.getElementById('game-board');gameBoard.innerHTML='';board.forEach((type,index)=>{const block=document.createElement('div');block.className='block';block.dataset.type=type;block.dataset.index=index;block.textContent=symbols[type-1];block.style.animationDelay=`${(index%BOARD_SIZE)*.1}s`;block.addEventListener('click',()=>handleBlockClick(index));gameBoard.appendChild(block);});}
function handleBlockClick(index){if(moves<=0)return;if(selectedBlock===null){selectedBlock=index;updateBlockSelection();}else if(selectedBlock===index){selectedBlock=null;updateBlockSelection();}else if(isAdjacent(selectedBlock,index)){if(board[selectedBlock]===board[index]){const connectedBlocks=findConnectedBlocks(index);if(connectedBlocks.length>=3){removeBlocks(connectedBlocks);moves--;combo++;score+=connectedBlocks.length*10*combo;}else combo=0;}else combo=0;selectedBlock=null;updateDisplay();updateBlockSelection();if(moves<=0)setTimeout(endGame,500);}else{selectedBlock=index;updateBlockSelection();}}
function isAdjacent(a,b){const r1=Math.floor(a/BOARD_SIZE),c1=a%BOARD_SIZE,r2=Math.floor(b/BOARD_SIZE),c2=b%BOARD_SIZE;return(Math.abs(r1-r2)===1&&c1===c2)||(Math.abs(c1-c2)===1&&r1===r2);}
function getNeighbors(index){const row=Math.floor(index/BOARD_SIZE),col=index%BOARD_SIZE,n=[];if(row>0)n.push(index-BOARD_SIZE);if(row<BOARD_SIZE-1)n.push(index+BOARD_SIZE);if(col>0)n.push(index-1);if(col<BOARD_SIZE-1)n.push(index+1);return n;}
function findConnectedBlocks(startIndex){const type=board[startIndex],connected=new Set([startIndex]),toCheck=[startIndex];while(toCheck.length){const current=toCheck.pop();for(let n of getNeighbors(current)){if(!connected.has(n)&&board[n]===type){connected.add(n);toCheck.push(n);}}}return Array.from(connected);}
function removeBlocks(indices){const blocks=document.querySelectorAll('.block');indices.forEach(i=>blocks[i].classList.add('matched'));setTimeout(()=>{indices.sort((a,b)=>b-a).forEach(i=>board.splice(i,1));while(board.length<BOARD_SIZE*BOARD_SIZE)board.unshift(Math.floor(Math.random()*BLOCK_TYPES)+1);renderBoard();},500);}
function updateBlockSelection(){document.querySelectorAll('.block').forEach((b,i)=>b.classList.toggle('selected',i===selectedBlock));}
function updateDisplay(){document.getElementById('score').textContent=score;document.getElementById('moves').textContent=moves;document.getElementById('combo').textContent=combo;}
function showHint(){for(let i=0;i<board.length;i++){for(let n of getNeighbors(i)){if(board[i]===board[n]){const connected=findConnectedBlocks(i);if(connected.length>=3){const blocks=document.querySelectorAll('.block');connected.forEach(index=>blocks[index].style.animation='pulse .5s ease-in-out 3');return;}}}}}
function endGame(){alert(`GAME OVER!\n\nFinal Score: ${score}\nCombo Record: ${combo}`);}
function createParticles(){document.querySelectorAll('.particle').forEach(p=>p.remove());for(let i=0;i<20;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*3+'s';p.style.animationDuration=(Math.random()*2+2)+'s';if(Math.random()>.5)p.style.background='#ff00ff';document.body.appendChild(p);}}
document.getElementById('new-game').addEventListener('click',initGame);
document.getElementById('hint').addEventListener('click',showHint);
initGame();
</script>
</body>
</html>
